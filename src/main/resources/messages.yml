# ============================================================================
#  SkyBlockWars — тексты игрокам (MiniMessage). Единственный источник строк для игрока.
#  Плейсхолдеры <n>/<arena>/<player>/... не должны совпадать с именами тегов.
# ============================================================================

menu:
  page-info: "<gray>Страница <yellow><page><gray>/<yellow><pages>"
  page-prev: "<yellow>◄ Назад"
  page-next: "<yellow>Вперёд ►"
  back: "<yellow>◄ Назад"

errors:
  world-not-loaded: "<red>Мир арены не загружен."
  arena-not-found: "<red>Арены <aqua><arena><red> нет."
  arena-exists: "<red>Арена <aqua><arena><red> уже существует."
  need-args: "<red>Недостаточно аргументов."
  not-a-number: "<red>Нужно число."
  unknown-sub: "<red>Неизвестная подкоманда. /sbw help"
  no-permission: "<red>Нет прав."

# ===== игровой цикл =====
game:
  already-in-game: "<red>Вы уже в игре."
  arena-disabled: "<red>Арена <aqua><arena><red> выключена."
  arena-not-ready: "<red>Арена <aqua><arena><red> не настроена (нужны лобби и спавны)."
  snapshot-exists: "<red>Осталось незавершённое состояние — перезайдите на сервер для восстановления и повторите."
  match-in-progress: "<red>На арене <aqua><arena><red> уже идёт матч."
  joined: "<green><player> <gray>вошёл (<yellow><current><gray>/<yellow><max><gray>)."
  player-left: "<yellow><player> <gray>вышел (<yellow><current><gray>)."
  you-left: "<yellow>Вы вышли с арены <aqua><arena><yellow>."
  leave-item-name: "<red>Выйти из игры"
  leave-item-lore:
    - "<gray>ПКМ — покинуть арену."
  countdown-start: "<green>Старт через <yellow><n> <green>сек."
  countdown: "<gray>Старт через <yellow><n><gray>..."
  countdown-cancel: "<red>Отсчёт отменён — мало игроков."
  started: "<green><b>Матч начался!</b> <gray>(<white><game><gray>)"
  eliminated: "<red><player> <gray>выбыл. Осталось: <yellow><alive>"
  left-match: "<yellow><player> <gray>покинул матч. Осталось: <yellow><alive>"
  winner: "<gold><b>Победитель: <yellow><winner></b>"
  draw: "<gray><b>Ничья.</b>"

# ===== выбор арены (/sbw) =====
select:
  title: "<dark_gray><b>Мини-игры</b>"
  empty-name: "<gray>Арен нет"
  empty-lore:
    - "<gray>Админ: /sbw create <ID>"
  status-disabled: "<red>выключена"
  status-idle: "<green>ожидание"
  status-running: "<yellow>идёт матч"
  lore-status: "<gray>Статус: <status>"
  lore-players: "<gray>Игроки: <yellow><current><gray>/<yellow><max>"
  lore-join: "<yellow>► ЛКМ — войти"

# ===== хаб настройки (/sbw gui) =====
hub:
  title: "<dark_gray><b>Настройка: </b>"
  close-name: "<red>Закрыть"
  status-id: "<dark_gray>id: <gray><id>"
  status-world: "<gray>Мир: <yellow><world>"
