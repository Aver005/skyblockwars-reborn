  status-no: "<red>нет"
  status-players: "<gray>Игроки: <yellow><min><gray>–<yellow><max>"
  status-spawns: "<gray>Спавнов: <yellow><n>"
  status-session: "<gray>Матч: <value>"
  status-running: "<green>идёт"
  status-idle: "<gray>нет"
  btn-settings-name: "<gold>Параметры"
  btn-settings-lore:
    - "<gray>Игроки, отсчёты, длительность."
  btn-points-name: "<gold>Точки"
  btn-points-lore:
    - "<gray>Спавны, лобби, блоки-подсказки."
  btn-name-name: "<gold>Имя арены"
  btn-name-lore:
    - "<gray>Ввод через наковальню (MiniMessage)."
  btn-desc-name: "<gold>Описание"
  btn-desc-lore:
    - "<gray>Ввод через наковальню."
  btn-check-name: "<gold>Проверка"
  btn-check-lore:
    - "<gray>Что мешает включить арену."
  btn-enable-name: "<green>Включить"
  btn-enable-lore:
    - "<gray>Проверит и включит арену."
  btn-disable-name: "<red>Выключить"
  btn-disable-lore:
    - "<gray>Снять арену с игры."
  btn-start-name: "<green>Форс-старт"
  btn-start-lore:
    - "<gray>Запустить матч (если есть лобби)."
  btn-stop-name: "<red>Остановить"
  btn-stop-lore:
    - "<gray>Досрочно завершить матч."
  name-anvil-title: "<dark_gray>Имя арены:"
  desc-anvil-title: "<dark_gray>Описание:"

# ===== ± редактор параметров =====
settings:
  title: "<dark_gray>Параметры: "
  value: "<gray>Текущее: <yellow><value>"
  note-zero: "<dark_gray>0 = без лимита"
  adjust:
    - "<dark_green>ЛКМ +1 <gray>(Shift +10)"
    - "<yellow>ПКМ -1 <gray>(Shift -10)"
  name-minplayers: "<gold>Мин. игроков"
  name-maxplayers: "<gold>Макс. игроков"
  name-lobbycountdown: "<gold>Отсчёт в лобби (сек)"
  name-countdownfull: "<gold>Отсчёт при полном лобби (сек)"
  name-duration: "<gold>Длительность матча (сек)"

# ===== точки =====
points:
  title: "<dark_gray>Точки: "
  count: "<gray>Спавнов: <yellow><n>"
  spawn-name: "<gold>Спавны"
  spawn-lore:
    - "<yellow>► Клик — получить маркер."
    - "<gray>ПКМ маркером по блоку = точка спавна,"
    - "<gray>Shift+ПКМ = убрать точку."
  spawn-given: "<green>Маркер спавна выдан. ПКМ по блоку — точка."
  lobby-name: "<gold>Лобби = моя позиция"
  lobby-current: "<gray>Лобби задано: <value>"
  lobby-yes: "<green>да"
  lobby-no: "<red>нет"
  lobby-lore:
    - "<yellow>► Клик — сделать лобби здесь."
  lobby-set: "<green>Лобби арены <aqua><arena><green> установлено."
  markers-name: "<gold>Расставить подсказки-блоки"
  markers-lore:
    - "<gray>Стёкла на лобби/спавнах — видно разметку."
    - "<gray>Снимаются в начале матча."
  markers-busy: "<red>Арена <aqua><arena><red> сейчас в матче."
  markers-placed: "<green>Подсказки расставлены на арене <aqua><arena><green>: <yellow><n>."

anvil:
  empty: "<red>Введите текст в поле переименования наковальни."

# ===== HUD =====
hud:
  title: "<gold><b><game></b>"
  line-arena: "<gray>Арена: <white><arena>"
  line-phase: "<gray>Фаза: <white><phase>"
  phase-lobby: "лобби"
  phase-countdown: "отсчёт"
  phase-running: "матч"
  phase-ending: "финиш"
  line-alive: "<gray>В игре: <green><n>"
  line-players: "<gray>Игроки: <yellow><n><gray>/<yellow><max>"
  line-time: "<gray>Время: <yellow><time>"
  bossbar-running: "<white>В игре: <green><alive> <gray>| <white>Время: <yellow><time>"
  bossbar-lobby: "<yellow>Ожидание игроков: <white><n><gray>/<white><max>"

