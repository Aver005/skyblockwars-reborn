  header: "<dark_green>===== <white><player> <dark_green>====="
  line-wins: "<gray>Побед: <green><n>"
  line-loses: "<gray>Поражений: <red><n>"
  line-kills: "<gray>Убийств: <yellow><n>"
  line-played: "<gray>Матчей: <white><n>"

# ===== проверка арены =====
