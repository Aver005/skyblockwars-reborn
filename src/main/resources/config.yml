# ============================================================================
#  SkyBlockWars — конфиг платформы мини-игр (шаблон).
#  Тексты игрокам — в messages.yml (MiniMessage). Здесь — только числа/флаги.
# ============================================================================

# Значения по умолчанию для НОВЫХ арен (у каждой арены свои копии в arena.yml).
arena-defaults:
  min-players: 2
  max-players: 12
  lobby-countdown-seconds: 20     # отсчёт в лобби до старта, когда набран минимум
  countdown-full-seconds: 5       # укороченный отсчёт, когда лобби заполнено
  match-duration-seconds: 600     # 0 = без лимита времени (матч до победителя)

# Поведение матча (общее для всех игр на этом сервере).
match:
  # На смерть игрок становится спектатором (fake death), а не респавнится ванильно.
  spectator-on-death: true
  # Восстанавливать изменённые блоки и удалять заспавненные сущности после матча.
  restore-world: true
  # Телепортировать выживших/спектаторов обратно в лобби арены после матча.
  return-to-lobby: true

# Чат во время матча: игроки видят только участников своей арены.
chat:
  scoped-to-arena: true
  format: "<gray>[<arena>] <white><player><gray>: <reset><message>"

# HUD (если модуль включён): сайдбар и босс-бар матча.
hud:
  scoreboard: true
  bossbar: true

# Отладочный лог: [DBG] в консоль на ключевые действия (ASCII).
debug-log:
  enabled: false
  console: true
